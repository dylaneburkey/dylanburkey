name: Job Radar scanner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'job-radar/scan.py'
      - 'job-radar/offices.json'
      - '.github/workflows/job-radar.yml'

permissions:
  contents: write

concurrency:
  group: job-radar-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan job boards and compute PwC office matches
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: python job-radar/scan.py

      - name: Commit only changed job data
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "job-radar[bot]@users.noreply.github.com"
          git add job-radar/data/jobs.json job-radar/data/geocache.json job-radar/data/route_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Update engineering job radar feed [skip ci]"
            git push
          else
            echo "Job data unchanged."
          fi
